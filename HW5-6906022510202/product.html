<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/gridstyle.css" />
    <title>AURA Acoustics - Products</title>
  </head>
  <body>
    <div class="page">
      <header class="header"><img src="images/header.jpg" alt="AURA" /></header>
      <nav class="navbar">
        <a href="index.html">Home</a><a href="product.html">Products</a>
      </nav>
      <div class="layout">
        <main class="main">
          <section class="section">
            <h1>Our Catalog</h1>
            <p>Browse products and details below.</p>
            <img
              class="product-image"
              src="images/product1.jpg"
              alt="Headphones"
            />
          </section>
          <section class="section">
            <h2>Product Name</h2>
            <p>
              Short description, price, and actions (add to cart, view details).
            </p>
            <img
              class="product-image"
              src="images/product2.jpg"
              alt="Product"
            />
          </section>
        </main>
        <aside class="register">
          <h2>สมัครสมาชิก</h2>
          <form action="#" method="post">
            <div class="form-group">
              <label for="fname">ชื่อ</label
              ><input id="fname" type="text" placeholder="ชื่อจริง" />
            </div>
            <div class="form-group">
              <label for="lname">นามสกุล</label
              ><input id="lname" type="text" placeholder="นามสกุล" />
            </div>
            <div class="form-group">
              <label for="email">อีเมล</label
              ><input
                id="email"
                type="email"
                placeholder="example@domain.com"
              />
            </div>
            <div class="form-group">
              <label for="password">รหัสผ่าน</label
              ><input
                id="password"
                type="password"
                placeholder="อย่างน้อย 8 ตัวอักษร"
              />
            </div>
            <div class="form-group">
              <label for="confirm">ยืนยันรหัสผ่าน</label
              ><input
                id="confirm"
                type="password"
                placeholder="ยืนยันรหัสผ่าน"
              />
            </div>
            <div class="form-group">
              <label for="phone">เบอร์โทรศัพท์</label
              ><input id="phone" type="text" placeholder="083-xxx-xxxx" />
            </div>
            <div class="form-group">
              <span class="form-title">เพศ</span>
              <div class="radio-list">
                <label><input type="radio" name="gender" /> ชาย</label
                ><label><input type="radio" name="gender" /> หญิง</label
                ><label><input type="radio" name="gender" /> ไม่ระบุ</label>
              </div>
            </div>
            <div class="form-group check-row">
              <label><input type="checkbox" /> รับข่าวสาร</label
              ><label><input type="checkbox" /> โปรโมชั่น</label
              ><label><input type="checkbox" /> กิจกรรม</label>
            </div>
            <div class="form-group">
              <label for="member">ประเภทสมาชิก</label>
              <select id="member">
                <option>Normal</option>
                <option>Premium</option>
                <option>VIP</option>
              </select>
            </div>
            <div class="form-group">
              <label
                ><input type="checkbox" required />
                ยอมรับข้อกำหนดและเงื่อนไข</label
              >
            </div>
            <button type="submit">สมัครสมาชิก</button>
            <p class="note">เราจะเก็บข้อมูลของคุณเป็นความลับ</p>
          </form>
        </aside>
      </div>
      <footer class="footer">
        <img src="images/footer.jpg" alt="footer" />
      </footer>
    </div>
  </body>
</html>
